kind: experiment
schema_version: 1
name: lightgbm_compare
seed: 42
dataset_path: datasets/candidates_v001/candidates.parquet
metadata_path: datasets/candidates_v001/metadata.json
features:
  use_profile: true
  use_request: true
  use_requirements: true
  use_candidate_features: true
  use_condition_score: false
  use_history: false
split:
  strategy: user_temporal_holdout
  seed: 42
  cold_user_ratio: 0.2
  validation_requests: 1
  test_requests: 1
  min_train_requests: 1
  insufficient_user: exclude
model:
  name: lightgbm_ranker
  params:
    n_estimators: 200
    learning_rate: 0.05
    num_leaves: 31
    max_depth: -1
    min_child_samples: 20
    reg_lambda: 0.0
    n_jobs: 1
evaluation:
  top_k: 3
  bootstrap_samples: 1000
  confidence_level: 0.95
output_dir: artifacts
