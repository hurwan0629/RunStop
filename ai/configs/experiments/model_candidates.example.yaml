# Baseline example. See ai/docs/MODELS.md or use create_config.py for other models.
kind: experiment
schema_version: 1
name: baseline_compare
seed: 42
dataset_path: datasets/candidates_v001/candidates.parquet
metadata_path: datasets/candidates_v001/metadata.json
features:
  use_profile: true
  use_request: true
  use_requirements: true
  use_candidate_features: true
  use_condition_score: false
  use_history: false
split:
  strategy: user_temporal_holdout
  seed: 42
  cold_user_ratio: 0.2
  validation_requests: 1
  test_requests: 1
  min_train_requests: 1
  insufficient_user: exclude
model:
  name: condition_score_baseline
  params: {}
evaluation:
  top_k: 3
  bootstrap_samples: 1000
  confidence_level: 0.95
output_dir: artifacts
