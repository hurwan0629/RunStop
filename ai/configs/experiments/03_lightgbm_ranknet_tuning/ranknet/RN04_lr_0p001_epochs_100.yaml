kind: experiment
schema_version: 1
name: RN04_lr_0p001_epochs_100
seed: 42
dataset_path: datasets/2026-09-14_11h17m54s_runstop_users_1000_5000_requests_behavioral/candidates.parquet
metadata_path: datasets/2026-09-14_11h17m54s_runstop_users_1000_5000_requests_behavioral/metadata.json
features:
  use_profile: false
  use_request: true
  use_requirements: true
  use_candidate_features: true
  use_condition_score: false
  use_history: false
split:
  strategy: user_temporal_holdout
  seed: 42
  cold_user_ratio: 0.2
  validation_requests: 1
  test_requests: 1
  min_train_requests: 1
  insufficient_user: exclude
model:
  name: ranknet
  params:
    hidden_dim: 64
    depth: 1
    dropout: 0.1
    epochs: 100
    batch_size: 256
    learning_rate: 0.001
    weight_decay: 0.01
    optimizer: adamw
evaluation:
  top_k: 3
  bootstrap_samples: 1000
  confidence_level: 0.95
output_dir: artifacts/03_lightgbm_ranknet_tuning/01_first_round/ranknet
