  # # # # # # # # # # # # # # # # # # # # # # # # # # # # 
 #     다음과 같은 구조를 가지고 있다는 가정 하에 동작합니다.    # 
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
#  MidProject/                                            #
#  ├─ .env.development                                    #
#  ├─ .env.test                                           #
#  ├─ .env.production                                     #
#  ├─ docker-compose.yml                                  #
#  │                                                      #
#  ├─ backend/                                            #  
#  │  └─ Dockerfile                                       #  
#  │                                                      #      
#  └─ routing-worker/                                     #    
#     └─ Dockerfile                                       #    
# # # # # # # # # # # # # # # # # # # # # # # # # # # # # #
services:    
  database:
    # name: runstop-database
    # PostGIS Extention이 붙어있는 17-3.5 버전을 거져옵니다.
    image: postgis/postgis:17-3.5
    # platform: linux/amd64
    env_file: # 동일한 파일에서 환경변수를 관리해줍니다.
      - .env.production
    # ports:
    #   - "5432:5432"
    volumes: # 컨테이너 데비안의 /var/lib/postgrersql/data에 있는 데이터를 볼륨으로 영속화합니다.
      - postgres-data:/var/lib/postgresql/data
    healthcheck: # 컨테이너 내부에서 사용하는 환경변수
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s # 10초 대기 후 다시시작
      timeout: 5s # 5초 지나면 타임아웃
      retries: 5 # 5번 반복

  routing-worker:
    # name: runstop-routing-worker
    # build: # `/routing-worker/Dockerfile` 을 빌드합니다.
    #   context: ./routing-worker
    # 배포시에는 ▼ 해당 이미지 ▼ 사용
    image: hurwan0629/runstop-routing-worker:latest
    # platform: linux/amd64
    env_file: # 메인 폴더의 환경을 그대로 사용합니다.
      - .env.production
    depends_on:
      database:
        condition: service_healthy
    
    # ports는 fastapi 워커 테스트 시에만 사용
    # ports: # FastAPI의 기본 포트인 8000번을 호스트의 포트와 연결시킵니다.
    #   - "8000:8000"

    healthcheck:
      test: 
        [
          "CMD", 
          "python", 
          "-c", 
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s # GraphML 로딩
      
  backend: # Node 서버
    # name: runstop-backend
    # build: # `./backend/Dockerfile` 을 빌드합니다.
    #   context: ./backend 
    # platform: linux/amd64
    # 배포시에는 ▼ 해당 이미지 ▼ 사용
    image: hurwan0629/runstop-backend:latest
    env_file:
      - .env.production
    # ports:
    #   - "3000:3000"
    depends_on: # DB와 워커 FastAPI가 먼저 시작 후 실행 (healthcheck를 이용해서 서버 정상동작까지 가능)
      database:
        condition: service_healthy
      routing-worker:
        condition: service_healthy
    healthcheck:
      test: 
        [
          "CMD", 
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  
  caddy:
    image: caddy:2
    env_file:
      - .env.production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  caddy_data:
  caddy_config: